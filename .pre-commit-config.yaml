repos:
  - repo: git@github.com:pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: php-cs-fixer
        name: php-cs-fixer
        entry: vendor/bin/php-cs-fixer fix --dry-run --diff
        language: system
        types: [php]
        pass_filenames: false

      - id: phpstan
        name: phpstan
        entry: vendor/bin/phpstan analyse --no-progress --error-format=raw
        language: system
        types: [php]
        pass_filenames: false

      - id: php-lint
        name: php-lint
        entry: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;
        language: system
        pass_filenames: false
